version: '3.8'

services:
  rust-server:
    build:
      context: ./mcp-rust-server
    image: mcp-sse-server-exp
    container_name: mcp-sse-server-exp
    ports:
      - "8001:8000"  # Map host 8001 to container 8000
    restart: unless-stopped

